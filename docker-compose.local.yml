# 로컬 개발 스택 — PostgreSQL + API + Redis + open-kknaks worker + MCP 서버 (+ 파일 저장소 볼륨).
# SPEC-000 §5 「백엔드는 compose 로 PostgreSQL + API 를 함께 띄운다」 · system/README.md §Component(배치 = 서버 1대에 전부).
# MCP 서버(`mcp`)는 WORK-009 에서 합류했다 — codex 가 우리 데이터를 읽는 유일한 길이고 **FastAPI 안이 아니다**(MF-68).
# 흐름은 `worker 의 codex → mcp → api 의 REST` 이고, 인증은 회의별 단명 토큰이다(MF-69).
# Redis · worker 는 회의록 배치(WORK-007 검수 D-8)에서 합류했다 — 없으면 `/start` 의 웜스타트가 브로커 연결에서 예외를 내
# 회의를 시작할 수 없다. 파일 저장소는 `storage` 명명 볼륨(`STORAGE_ROOT=/data`) — 녹음 원본은 컨테이너와 함께 사라지지 않는다.
#
# worker 준비물(호스트, .env 로 위치를 준다 — .env.example 참고):
#   1. 리눅스용 codex CLI 번들(node + @openai/codex) — CODEX_TOOLS_DIR. 이미지에 굽지 않는다(system/README.md §codex 바인드 마운트)
#   2. codex 로그인 결과 auth.json — CODEX_AUTH_JSON. **파일 하나만** ro 로 얹는다

name: task-management-local

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    # open-kknaks 브로커(system/README.md §Component). 캐시·세션 저장소로 쓰지 않는다.
    image: redis:7-alpine
    ports:
      # 호스트에서 직접 돌리는 pytest·uvicorn 용 — .env 의 REDIS_URL(redis://localhost:6379/0)이 여기로 붙는다.
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ./app/back
    env_file:
      - .env
    environment:
      # 컨테이너 안에서는 DB 호스트가 `db` 다. 호스트용 .env 값을 덮어쓴다.
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      # 브로커도 같은 이유로 덮어쓴다 — config.py 기본값(localhost)은 컨테이너 안에서 닿지 않는다.
      REDIS_URL: redis://redis:6379/0
      # 녹음 원본 · md 저장 루트 — 아래 저장소 볼륨(SPEC-007 M-13 영구 보관).
      STORAGE_ROOT: /data
      # codex 가 부를 MCP 주소 — **옵션을 만드는 곳은 back 하나**라 worker 가 아니라 여기에 준다(WORK-009 Phase 3).
      MCP_SERVER_URL: http://mcp:8010/mcp
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./app/back:/app
      # 저장소 — 기본은 `storage` 명명 볼륨이고, `.env` 의 `STORAGE_HOST_DIR` 에 **호스트 경로**를 주면 그 폴더를 바인드한다.
      # 녹음 원본을 호스트에서 바로 열어 보려고 연 자리다(2026-09-08 사용자 요청) — 값이 비면 지금까지와 같다.
      - ${STORAGE_HOST_DIR:-storage}:/data
    command:
      - uvicorn
      - main:app
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      - --reload
    healthcheck:
      # `mcp` 가 이 상태를 기다린다(기동 순서 api → mcp). 이미지에 curl 이 없어 python 으로 친다.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

  mcp:
    # MCP 서버 — 도구 7개(전부 조회). **우리 코드지만 back 과 다른 이미지**다(MF-68) — DB 를 모르고 back 을 import 하지 않는다.
    # 받은 `Authorization`(회의별 단명 토큰)을 그대로 api 로 넘긴다. 권한 판정은 api 가 진다(MF-4).
    build:
      context: ./app/mcp
    environment:
      # 이 컨테이너가 부를 back 주소. **기본값이 없다** — 없으면 server.py 가 기동에서 죽는다.
      MCP_BASE_URL: http://api:8000
      MCP_PORT: "8010"
    ports:
      # 호스트에서 도구를 직접 찔러 볼 때만 쓴다. worker 는 컨테이너 이름(`mcp`)으로 붙는다.
      - "${MCP_PORT:-8010}:8010"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('localhost', 8010), 3).close()"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

  worker:
    # open-kknaks 데몬 — codex 실행. 우리 코드가 아니다(Dockerfile.worker 머리 주석). back 과 **같은** 브로커·네임스페이스·큐.
    build:
      context: ./app/back
      dockerfile: Dockerfile.worker
    environment:
      REDIS_URL: redis://redis:6379/0
      # .env 의 AI_NAMESPACE · AI_QUEUE 와 같은 값(BE §11 「worker 설정과 일치해야 한다」). 기본값은 config.py 와 같다.
      AI_NAMESPACE: ${AI_NAMESPACE:-task-management}
      AI_QUEUE: ${AI_QUEUE:-default}
      AI_CWD: /work
      CONCURRENCY: ${WORKER_CONCURRENCY:-1}
      CODEX_HOME: /root/.codex
      # 마운트한 codex 번들을 PATH 선두에 — open-kknaks 는 `which("codex")` 로만 찾는다.
      PATH: /claude-tools/node/bin:/claude-tools/node_modules/.bin:/usr/local/bin:/usr/bin:/bin
    volumes:
      # 출력 스키마 — back 이 `provider_options.output_schema` 로 넘기는 경로(/app/ai_schemas/*.json)가 워커에서도 같은 자리여야 한다.
      - ./app/back:/app:ro
      # 호스트의 리눅스용 codex 번들(ro). 위치는 .env CODEX_TOOLS_DIR.
      - ${CODEX_TOOLS_DIR:?.env 에 CODEX_TOOLS_DIR(호스트의 리눅스용 codex 번들 경로)을 설정하라 — .env.example 참고}:/claude-tools:ro
      # codex 세션 영속 — resume(mode=session)이 워커 재시작을 넘겨 살아남는 조건(DEC-003 §STT).
      - codex-sessions:/root/.codex
      # 인증 — 파일 하나만 ro. 세션 디렉터리를 통째로 내주지 않는다(system/README.md §codex 바인드 마운트).
      - ${CODEX_AUTH_JSON:?.env 에 CODEX_AUTH_JSON(호스트의 codex auth.json 경로)을 설정하라 — .env.example 참고}:/root/.codex/auth.json:ro
    depends_on:
      redis:
        condition: service_healthy
      # 기동 순서 api → mcp → worker(WP §Pre-deploy Check). mcp 가 늦게 뜨면 그 사이 제출된 웜스타트·배치가
      # **에러가 아니라 조용히 「툴 0개」**로 돈다 — codex 에 deny list 가 없고 틀린 MCP 주소는 침묵한다.
      mcp:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "codex", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  pgdata:
  # 녹음 원본 · md 본문(STORAGE_ROOT) — `down` 으로 사라지지 않는다(`down -v` 만 지운다).
  storage:
  # 워커의 codex 세션 — 회의 하나의 배치 세션이 재시작을 넘겨 살아남아야 한다.
  codex-sessions:
